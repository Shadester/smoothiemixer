services:
  smoothiemixer:
    build: .
    ports:
      - "8080:8000"
    volumes:
      - smoothie-data:/data
    environment:
      - DB_PATH=/data/smoothiemixer.db
      # Set ANTHROPIC_API_KEY in a .env file alongside this compose file to enable AI mode.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    # Target Raspberry Pi (arm64). For 32-bit Pi: linux/arm/v7
    platform: linux/arm64

volumes:
  smoothie-data:
