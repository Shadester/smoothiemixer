services:
  smoothiemixer:
    build: .
    ports:
      - "8080:8000"
    volumes:
      - smoothie-data:/data
    environment:
      - DB_PATH=/data/smoothiemixer.db
      # Uncomment and set to enable AI mode:
      # - ANTHROPIC_API_KEY=sk-ant-...
    restart: unless-stopped
    # Target Raspberry Pi (arm64). For 32-bit Pi: linux/arm/v7
    platform: linux/arm64

volumes:
  smoothie-data:
